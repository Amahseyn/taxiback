name: Backend Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend with SSH and PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST || '176.222.53.21' }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            if [ ! -d "/var/www/taxiback/.git" ]; then
              mkdir -p /var/www
              git clone https://github.com/Amahseyn/taxiback.git /var/www/taxiback
            fi
            cd /var/www/taxiback
            git fetch --all
            git checkout main || git checkout master
            git pull

            # Ensure .env exists
            if [ ! -f ".env" ]; then
              if [ -f ".env.production" ]; then
                cp .env.production .env
              elif [ -f ".env.production.template" ]; then
                cp .env.production.template .env
              else
                cat > .env << 'ENV_EOF'
            NODE_ENV=production
            PORT=5000
            DATABASE_URL="postgresql://taxi_user:TaxiDb2026!SecurePass@127.0.0.1:5432/taxi_db?schema=public"
            JWT_ACCESS_SECRET=e7bf9d91f2c2b3a88a0b12739281a8b9
            JWT_REFRESH_SECRET=b81a8c9281a9c8b7e6d5c4b3a2918273
            ENV_EOF
              fi
            fi

            npm ci --include=dev --ignore-scripts=false
            ./node_modules/.bin/prisma generate
            ./node_modules/.bin/prisma db push --accept-data-loss
            ./node_modules/.bin/prisma db seed || true
            npx pm2 start ecosystem.config.js --env production --only taxiback || npx pm2 reload ecosystem.config.js --env production --only taxiback
            npx pm2 save
