name: Backend Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches:
      - main
      - master

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend with SSH and PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/taxiback || git clone https://github.com/Amahseyn/taxiback.git /var/www/taxiback
            cd /var/www/taxiback
            git pull origin main
            npm ci
            npx prisma generate
            npx pm2 start ecosystem.config.js --env production --only taxiback || npx pm2 reload ecosystem.config.js --env production --only taxiback
